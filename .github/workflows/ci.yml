   name: CI
   on:
     pull_request:
     push:
       branches: [main]
   jobs:
     test:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-node@v4
           with:
             node-version: 20
         - name: Server tests
           run: npm ci && npm test
           working-directory: server
         - name: Client build
           run: npm ci && npm run build
           working-directory: client